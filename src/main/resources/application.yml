spring:
  application:
    name: ums
  datasource:
    url: jdbc:mysql://localhost:3306/ums?characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: ums
    password: ums
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

app:
  session-ttl: 24h
  admin:
    login: admin
    password: admin12345
    email: admin@twitter.local
    name: Administrator
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

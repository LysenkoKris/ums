spring:
  datasource:
    url: jdbc:h2:mem:ums;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V1__init.sql
        - classpath:db/migration/V2__add_guest_role.sql

services:
  mysql:
    image: mysql:8.4
    container_name: ums-mysql
    environment:
      MYSQL_DATABASE: ums
      MYSQL_USER: ums
      MYSQL_PASSWORD: ums
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ums-mysql:/var/lib/mysql

volumes:
  ums-mysql:
